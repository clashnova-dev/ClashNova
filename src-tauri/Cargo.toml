[package]
authors = ["clashnova-dev"]
name = "airport-client"
version = "0.1.7"
edition = "2021"
description = "ClashNova desktop proxy client"

[lib]
name = "airport_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
airport-tun-service = { path = "../tun-service" }
lan-service = { path = "../lan-service" }
sha2 = "0.10"
tauri-plugin-notification = "2"
getrandom = "0.3"
tokio = { version = "1", features = ["time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", features = ["blocking"] }
tempfile = "3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Power", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk-pixbuf = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSCell", "NSControl", "NSResponder", "NSStatusBarButton", "NSView", "NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = ["NSData", "NSString", "NSDictionary"]
